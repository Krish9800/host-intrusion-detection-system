[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "host-intrusion-detection-system"
version = "1.0.0"
description = "Production-grade Host Intrusion Detection System (HIDS) with FIM, process anomaly detection, auth log parsing, and MITRE ATT&CK correlation."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Cybersecurity Portfolio Team" }]
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "watchdog>=4.0.0",
    "psutil>=5.9.8",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "typer>=0.12.3",
    "rich>=13.7.1",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "anyio>=4.4.0",
    "starlette>=0.37.2",
    "httpx>=0.27.0",
    "mypy>=1.10.0",
    "ruff>=0.4.5",
    "bandit>=1.7.8",
    "types-psutil>=5.9.5",
    "types-pyyaml>=6.0.12",
]

[project.scripts]
hids = "hids.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "B",
    "C4",
    "UP",
    "SIM",
    "T20",
]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"src/hids/cli/*" = ["T201"]
"tests/*" = ["T201"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.bandit]
targets = ["src"]
exclude_dirs = ["tests", ".venv"]
skips = ["B101", "B404", "B603", "B607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-v --strict-markers"
