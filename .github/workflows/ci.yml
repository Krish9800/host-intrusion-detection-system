name: HIDS Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gate:
    name: Code Quality, Security & Coverage Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Code Formatting Check (Ruff)
        run: |
          ruff format --check src/ tests/

      - name: Code Linting Check (Ruff)
        run: |
          ruff check src/ tests/

      - name: Static Type Analysis (Mypy Strict)
        run: |
          mypy --strict src/ tests/

      - name: Static Security Audit (Bandit SAST)
        run: |
          bandit -r src/ -ll

      - name: Test Suite & Coverage (Pytest >= 90%)
        run: |
          pytest --cov=hids --cov-report=term-missing --cov-fail-under=90 tests/
